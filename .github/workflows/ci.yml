name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/storage_controller_test
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/storage_controller_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check
      - run: exit 1 # Тестую червоний прогін

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: storage_controller_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d storage_controller_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure test database
        run: |
          echo 'DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/storage_controller_test' > .env.test
          echo 'SHADOW_DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/storage_controller_shadow' >> .env.test
          cp .env.test .env
      - run: npm run db:generate
      - run: npm run db:test:prepare
      - run: npm run test:db
      - run: npm --prefix frontend ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
        env:
          SESSION_SECRET: test-only-session-secret-1234567

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check commit messages
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
